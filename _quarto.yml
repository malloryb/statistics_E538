project:
  type: book
  output-dir: docs
  execute-dir: project

book:
  title: "Statistics for Environmental Science"
  source: https://crumplab.com/statistics/
  license: CC BY-SA
  cover-image: imgs/TextbookCover.png
  original-author:
    - "Matthew J. C. Crump"
    - "Danielle J. Navarro"
    - "Jeffrey Suzuki"
  author:
    - name:
        given: Mallory
        family: Barnes
        literal: Mallory Barnes
      affiliations:
        - name: Indiana University Bloomington
          department: Paul H. O'Neill School of Public and Environmental Affairs
          address: 107 S. Indiana Avenue
          city: Bloomington
          region: IN
          postal-code: 47405
          url: https://www.indiana.edu/
      url: https://oneill.indiana.edu/faculty-research/directory/profiles/faculty/full-time/barnes-mallory.html
      email: malbarn@iu.edu
      orcid: 0000-0001-8528-6981
  original-date: "2018-09-01"
  date: last-modified
  abstract: "This comprehensive resource offers a free, accessible textbook for environmental science students embarking on introductory statistics. The package includes a practical lab manual and a dedicated course website, all provided under a CC BY-SA 4.0 license."
  chapters:
    - index.qmd
    - 01-Data_Description.qmd
    - 02-Correlation.qmd
    - 03-SamplesPopulations.qmd
    - 04-Foundation_Inference.qmd
    - 05-Hypothesis_Testing.qmd
    - 06-ttests.qmd
    - 07-Nonparametric.qmd
    - 08-ANOVA.qmd
    - 09-Regression.qmd
    - 10-FactorialANOVA.qmd
    - 11-ANCOVA.qmd
    - references.qmd

  sidebar:
    collapse-level: 1
    search: true
  # site-url:
  repo-url: https://github.com/malloryb/statistics_E538
  repo-branch: master
  repo-actions: [edit]
  # google-analytics:
  open-graph: true

bibliography: [StatisticsTextbook.bib]

format:
  html:
    theme: cosmo
    date-modified: last-modified
    license: CC BY-SA
    copyright: Mallory Barnes
    fig-format: png

editor: source

execute:
  cache: false
  cache-dir: .qmd-cache
  freeze: auto
  echo: false
  warning: false
  message: false
