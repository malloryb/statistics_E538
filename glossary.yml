# E-538 glossary. glossary.qmd reads this file when the book renders.
# Each definition matches the chapter that defines the term. Change both together.

- term: "adjusted difference"
  definition: "How much the groups differ when they are compared at the same covariate value."
  chapter: 11
- term: "adjusted means"
  definition: "The group means you would expect if both groups had the same average covariate value."
  chapter: 11
- term: "alpha (α)"
  see: "significance level (α)"
  chapter: 4
- term: "alternative hypothesis (Hₐ)"
  definition: "The claim that the population mean does not equal $\\mu_0$. It can also point in one direction only, larger or smaller."
  chapter: 4
- term: "Analysis of covariance (ANCOVA)"
  definition: "A linear model with a continuous outcome, at least one continuous predictor (the covariate), and at least one categorical predictor (the factor)."
  chapter: 11
- term: "ANOVA table"
  definition: "An ANOVA table lists the sums of squares, degrees of freedom, mean squares, and $F$ for each source of variation."
  chapter: 8
- term: "balanced"
  definition: "A design is balanced when every group, or every combination of conditions, has the same number of observations."
  chapter: 8
- term: "best-fit line"
  definition: "The straight line that summarizes the pattern of dots with the least error."
  chapter: 2
- term: "beta (β)"
  see: "Type II error"
  chapter: 5
- term: "between-subjects"
  definition: "A between-subjects design has different units in each condition, and each unit is measured once."
  chapter: 6
- term: "biased estimator"
  see: "unbiased and biased estimators"
  chapter: 3
- term: "biased sample"
  definition: "A sample where some part of the design (who, where, when, or how you measure) pushes results in one direction, on purpose or not. More data does not fix it."
  chapter: 3
- term: "categorical variable"
  see: "nominal variable"
  chapter: 1
- term: "causal directionality problem"
  definition: "The causal directionality problem arises when $X$ and $Y$ are causally linked but no outside knowledge, such as the physics of the system or which variable came first, settles the direction."
  chapter: 2
- term: "cell"
  definition: "One combination of categories or conditions in a table, such as one land use with one temperature outcome, or one pollution condition with one flow rate."
  chapter: 7
- term: "cell mean"
  definition: "The mean of the scores in one cell."
  chapter: 10
- term: "centering"
  definition: "Subtracting a covariate's mean from every value, $\\tilde x = x - \\bar x$."
  chapter: 11
- term: "central limit theorem (CLT)"
  definition: "As $n$ grows, the sampling distribution of the mean approaches a normal shape, whatever the shape of the population, as long as the population has a finite standard deviation. It is the only one of the three facts about the sampling distribution that concerns shape."
  chapter: 3
- term: "central tendency"
  definition: "A single representative value near the center of a distribution, summarizing what most of the data are like."
  chapter: 1
- term: "chance window"
  definition: "The distribution of results that chance alone produces when a study with no real effect is repeated many times."
  chapter: 2
- term: "chi-square distribution"
  definition: "The family of curves that the $\\chi^2$ statistic approximately follows when $H_0$ is true and expected counts are large enough."
  chapter: 7
- term: "chi-square goodness-of-fit test"
  definition: "The chi-square goodness-of-fit test checks how well (the \"goodness\") the observed counts for one categorical variable match (the \"fit\") the counts expected under a stated pattern."
  chapter: 7
- term: "chi-square test of independence"
  definition: "A test of whether two categorical variables measured on the same units are related."
  chapter: 7
- term: "chi-square (χ²) tests"
  definition: "Tests that compare the counts observed in each category with the counts expected under $H_0$."
  chapter: 7
- term: "Cohen's d"
  definition: "The raw difference, $\\Delta$, divided by the population standard deviation, so it gives the effect in standard deviations."
  chapter: 5
- term: "conditional probability"
  definition: "The probability of one thing *given that* something else has already happened."
  chapter: 3
- term: "confidence interval (CI)"
  definition: "A range of plausible values for the population mean, built by a method that captures the true mean a known percentage of the time across repeated samples. That percentage, such as 95%, is the confidence level, $1 - \\alpha$."
  chapter: 3
- term: "confidence level"
  see: "confidence interval (CI)"
  chapter: 4
- term: "confounding variable"
  definition: "A third variable that drives both of the variables you are looking at, creating an apparent relationship between them or inflating a real one."
  chapter: 2
- term: "continuous variable"
  definition: "A variable that can, in principle, take on any value within a range."
  chapter: 1
- term: "correlation"
  definition: "A relationship in which values of one variable tend to go with values of another. It is positive when higher values go with higher values, negative when higher values go with lower values, and absent when there is no consistent pattern."
  chapter: 2
- term: "covariance"
  definition: "The mean of the products of paired deviations, $(x_i - \\bar{x})(y_i - \\bar{y})$. Its sign shows whether being above the mean on $X$ tends to come with being above or below the mean on $Y$."
  chapter: 2
- term: "covariate"
  definition: "A continuous predictor that is related to the outcome and helps explain part of its variation."
  chapter: 11
- term: "critical value"
  definition: "The value of the test statistic that cuts off the most extreme $\\alpha$ of the sampling distribution under $H_0$."
  chapter: 4
- term: "degrees of freedom"
  definition: "The number of values still free to vary once something has been estimated from the data. It sets which $t$, $F$ or $\\chi^2$ curve applies."
  chapter: 6
- term: "dependent variable (DV)"
  definition: "The variable being explained, written $Y$."
  chapter: 1
- term: "descriptive statistics"
  definition: "The numbers and plots that summarize a dataset."
  chapter: 1
- term: "deviation score"
  definition: "A score minus the mean, $x_i - \\bar{x}$. Not the same as a difference score."
  chapter: 2
- term: "difference score"
  definition: "One unit's second measurement minus its first."
  chapter: 6
- term: "discrete variable"
  definition: "A variable with separate, distinct values and nothing in between."
  chapter: 1
- term: "distribution"
  definition: "The pattern of which values occur in a dataset and how often each occurs."
  chapter: 1
- term: "effect"
  definition: "The difference a study is about, such as how far apart two group means are, or how far a mean is from the value $H_0$ states."
  chapter: 5
- term: "effect size"
  definition: "The number that says how large the effect is, in the study's units or in standard deviations."
  chapter: 5
- term: "error term"
  definition: "The part of the DV that the population line does not explain, $\\varepsilon$."
  chapter: 9
- term: "estimated population distribution"
  definition: "A normal curve centered at the sample mean, $\\bar{x}$, with the sample's standard deviation, $s$, as its spread."
  chapter: 4
- term: "estimation"
  definition: "Estimation uses sample data to give a best guess of a population value, along with how uncertain that guess is."
  chapter: 3
- term: "eta-squared"
  definition: "The usual effect size for ANOVA, the proportion of the total variation in the response that the grouping variable explains."
  chapter: 8
- term: "expected count"
  definition: "The expected count for a category is the total count times the probability $H_0$ gives that category."
  chapter: 7
- term: "expected value"
  definition: "The mean of a probability distribution, the long-run average of the outcomes if the random process were repeated forever."
  chapter: 3
- term: "experimental research"
  definition: "Research in which the researcher deliberately manipulates something (the IV) and measures its effect (the DV). An experiment needs the manipulation, a control or comparison group, and random assignment of units to the groups."
  chapter: 1
- term: "extrapolation"
  definition: "Extrapolation is predicting $y$ at an $x$ value outside the range of $x$ we observed."
  chapter: 9
- term: "factor"
  definition: "In ANOVA, an independent variable. The groups it defines are its levels."
  chapter: 8
- term: "factorial design"
  definition: "A factorial design has two or more IVs, and each of its conditions is a combination of one level from each IV."
  chapter: 10
- term: "familywise error rate"
  definition: "The chance of at least one false positive across a set of tests."
  chapter: 8
- term: "formal power analysis"
  definition: "Finding the sample size $n$ that gives a target power, usually 80%, for a chosen $\\Delta$, $\\sigma$, $\\alpha$ and number of tails, before any data are collected."
  chapter: 5
- term: "F statistic"
  definition: "The ratio $MS_\\text{Between}/MS_\\text{Within}$. A large $F$ means the differences between group means are large relative to the variation within groups."
  chapter: 8
- term: "grand mean"
  definition: "The mean of all of the scores, across every group."
  chapter: 8
- term: "histogram"
  definition: "A plot that summarizes data by grouping values into bins rather than showing each point separately."
  chapter: 1
- term: "homogeneity of variance"
  definition: "The groups have roughly equal spread around their own means. One of ANOVA's assumptions."
  chapter: 8
- term: "independent events"
  definition: "Two events are independent when knowing that one occurred tells you nothing about whether the other did. Every test in this book assumes independent observations."
  chapter: 3
- term: "independent-samples t-test"
  definition: "A test that compares the means of two separate groups, with a standard error built from the pooled standard deviation."
  chapter: 6
- term: "independent variable (IV)"
  definition: "The variable used to explain another, written $X$."
  chapter: 1
- term: "indicator variable"
  definition: "A variable that equals 1 for observations in one group and 0 for all other observations."
  chapter: 11
- term: "inference"
  definition: "Using data from a sample to draw conclusions about the broader population the sample came from."
  chapter: 3
- term: "inferential statistics"
  definition: "Inferential statistics is the branch of statistics concerned with drawing conclusions about populations or causal relationships from sample data."
  chapter: 3
- term: "interaction"
  definition: "An interaction occurs when the effect of one IV depends on the level of another."
  chapter: 10
- term: "interpolation"
  definition: "Interpolation is predicting $y$ at an $x$ value inside the range of $x$ we observed."
  chapter: 9
- term: "interval variable"
  definition: "A variable with equal spacing between values, so differences are meaningful. Its zero does not mean none of the quantity, so ratios between values are not meaningful."
  chapter: 1
- term: "Kruskal-Wallis test"
  definition: "The rank-based, nonparametric alternative to one-way ANOVA."
  chapter: 8
- term: "law of large numbers"
  definition: "As the sample size grows, the sample mean $\\bar{x}$ of a random sample converges toward the population mean $\\mu$."
  chapter: 3
- term: "left-skewed distribution"
  definition: "A distribution with a long tail of low values stretching out to the left."
  chapter: 1
- term: "levels"
  definition: "The groups a factor defines."
  chapter: 8
- term: "linear regression"
  definition: "Linear regression fits the straight line that best predicts one variable from another."
  chapter: 2
- term: "main effect"
  definition: "The difference between the marginal means of one IV."
  chapter: 10
- term: "Mann-Whitney-Wilcoxon test"
  definition: "The rank-based alternative to the independent-samples $t$-test, which does not assume normality."
  chapter: 7
- term: "marginal mean"
  definition: "The mean for one level of a factor, averaged across the levels of the other factor."
  chapter: 10
- term: "mean"
  definition: "The sum of a set of numbers divided by how many numbers there are. Also called the average."
  chapter: 1
- term: "mean difference"
  definition: "One group's mean minus another group's mean."
  chapter: 4
- term: "mean square"
  definition: "A sum of squares divided by its degrees of freedom."
  chapter: 8
- term: "median"
  definition: "The exact middle of the data once they are ordered from smallest to largest."
  chapter: 1
- term: "mixed design"
  definition: "A mixed design has at least one between-subjects factor and at least one within-subjects factor."
  chapter: 10
- term: "mode"
  definition: "The most frequently occurring value."
  chapter: 1
- term: "model"
  definition: "An equation that describes how the DV changes with a predictor, plus a term for the variation the equation leaves out."
  chapter: 9
- term: "multiplication rule"
  definition: "The probability that two events both happen is the probability of the first times the conditional probability of the second given the first. For independent events, it is the product of their separate probabilities."
  chapter: 3
- term: "nominal variable"
  definition: "A variable whose values are names with no order. Also called a categorical variable."
  chapter: 1
- term: "non-experimental research"
  definition: "Research in which the researcher observes conditions instead of assigning them."
  chapter: 1
- term: "nonparametric test"
  definition: "A test whose null distribution does not depend on the population having a particular shape, such as normal."
  chapter: 7
- term: "nuisance covariate"
  definition: "A covariate you adjust for so that a group comparison is fair, when the group comparison is the question."
  chapter: 11
- term: "null distribution"
  definition: "The distribution of a test statistic across many samples when $H_0$ is true."
  chapter: 6
- term: "null hypothesis (H₀)"
  definition: "The claim of no effect or no difference. In a one-sample test, it says the population mean equals a reference value, $\\mu_0$. It is a statement about the population, and it never mentions the sample mean."
  chapter: 4
- term: "null population distribution"
  definition: "The population we would have if $H_0$ were true."
  chapter: 4
- term: "omnibus test"
  definition: "A single test that covers several comparisons at once."
  chapter: 8
- term: "one-sample t-test"
  definition: "A test that compares one sample mean with a reference value, $\\mu_0$, using the standard deviation estimated from the sample."
  chapter: 6
- term: "operational definition"
  definition: "The result of operationalization, the specific quantity chosen to stand for a concept."
  chapter: 1
- term: "operationalization"
  definition: "Turning an abstract concept into a specific, measurable procedure."
  chapter: 1
- term: "ordinal variable"
  definition: "A variable whose values have a meaningful order, but the spacing between values is not defined."
  chapter: 1
- term: "outcome"
  definition: "When $X$ is used to predict $Y$ rather than manipulated, $Y$ is the outcome."
  chapter: 1
- term: "outlier"
  definition: "A value much farther from the bulk of the data than the rest of the values."
  chapter: 1
- term: "paired t-test"
  definition: "A test that compares two measurements on the same units by running a one-sample $t$-test on the difference scores."
  chapter: 6
- term: "parallel-lines model"
  definition: "The parallel-lines model includes $\\beta_2$ but leaves out $\\beta_3$, so the intercept can shift between groups but the slope cannot, and the two lines are parallel."
  chapter: 11
- term: "parametric test"
  definition: "One whose null distribution we can know only by assuming something specific about the shape of the population the data came from."
  chapter: 7
- term: "partial eta-squared"
  definition: "Partial eta-squared ($\\eta_p^2$) is the share of the variation left after setting the other effects aside that one effect explains."
  chapter: 10
- term: "Pearson's r"
  definition: "Pearson's $r$ is the covariance of $X$ and $Y$ divided by the product of their standard deviations."
  chapter: 2
- term: "pooled standard deviation"
  definition: "The square root of the pooled variance, $s_p$. The standard error of the difference is built from it."
  chapter: 6
- term: "pooled variance"
  definition: "One combined estimate of the variance the two groups share, a weighted average of the two sample variances, each weighted by its degrees of freedom."
  chapter: 6
- term: "population"
  definition: "The (usually much larger) set of all individuals or observations you want to draw conclusions about."
  chapter: 3
- term: "population parameters"
  definition: "Population parameters are the numbers that describe a population distribution, such as its mean $\\mu$ and standard deviation $\\sigma$."
  chapter: 3
- term: "post-hoc comparisons"
  definition: "Post-hoc comparisons are tests run after a significant omnibus test to find which pairs of groups differ."
  chapter: 8
- term: "post-hoc power"
  definition: "Power computed after a study, using the effect size the study observed. It is a restatement of the $p$-value, so it should not be reported."
  chapter: 5
- term: "power"
  definition: "The probability that a design correctly rejects $H_0$ when a real effect of a specified size exists, at the chosen $\\alpha$. It equals $1 - \\beta$."
  chapter: 5
- term: "practical significance"
  definition: "The effect is large enough to change what someone does about it. This is a judgment about the world, not a calculation."
  chapter: 5
- term: "predictor"
  definition: "When $X$ is used to predict $Y$ rather than manipulated, $X$ is the predictor."
  chapter: 1
- term: "probability"
  definition: "The long-run proportion of times an event would occur if the process were repeated many times (the frequentist view this book uses)."
  chapter: 3
- term: "probability density"
  definition: "Probability density is the height of a continuous distribution's curve at a point, written $p(x)$."
  chapter: 3
- term: "probability distribution"
  definition: "A rule that assigns probabilities to all possible outcomes of a random variable."
  chapter: 3
- term: "p-value"
  definition: "The probability, assuming $H_0$ is true, of obtaining a test statistic at least as extreme as the one observed."
  chapter: 4
- term: "Q-Q plot"
  definition: "A Q-Q plot sorts the residuals and compares them to where a perfectly normal distribution would place values at the same percentiles."
  chapter: 9
- term: "quasi-experiment"
  definition: "A non-experimental study that compares conditions the researcher did not create."
  chapter: 1
- term: "randomization"
  definition: "Assigning each unit to a condition by chance."
  chapter: 1
- term: "random variable"
  definition: "Any quantity whose value is not settled in advance, such as the flavor the next customer picks or the number of rainy days next month."
  chapter: 3
- term: "range"
  definition: "The largest value minus the smallest value."
  chapter: 1
- term: "rank"
  definition: "The rank of a value is its position when the data are put in order from smallest to largest (first, second, third, and so on)."
  chapter: 7
- term: "ratio variable"
  definition: "A variable with equal spacing between values and a true zero, where zero means none of the quantity, so ratios between values are meaningful."
  chapter: 1
- term: "regression coefficients"
  definition: "The intercept and slope of a regression line, $\\beta_0$ and $\\beta_1$."
  chapter: 9
- term: "rejection region"
  definition: "The set of test-statistic values beyond the critical value(s)."
  chapter: 4
- term: "repeated-measures design"
  definition: "A design that measures the same units under every condition. Also called a within-subjects design."
  chapter: 8
- term: "residual"
  definition: "The vertical distance from a data point to the fitted line, the observed $y$ minus the $y$ the line predicts."
  chapter: 2
- term: "right-skewed distribution"
  definition: "A distribution with a long tail of high values stretching out to the right."
  chapter: 1
- term: "R-squared (R²)"
  definition: "The proportion of the total variation in $y$ explained by the line."
  chapter: 9
- term: "sample"
  definition: "The finite set of data points a study actually collects."
  chapter: 3
- term: "sample mean"
  definition: "The average of one sample, $\\bar{x}$."
  chapter: 3
- term: "sample statistics"
  definition: "Sample statistics are numbers calculated from the data in a sample, such as $\\bar{x}$ and $s$."
  chapter: 3
- term: "sampling distribution"
  definition: "The distribution of a statistic, such as the mean, across many samples of the same size $n$."
  chapter: 3
- term: "sampling distribution of the sample mean"
  definition: "The distribution of the means of many samples of size $n$, as if the study were repeated many times."
  chapter: 3
- term: "sampling distribution of the sample mean under H₀"
  definition: "How $\\bar{x}$ would vary across many samples if $H_0$ were true, $N(\\mu_0, SE_{\\bar{x}}^2)$. The critical values and the $p$-value come from it."
  chapter: 4
- term: "sampling error"
  definition: "A larger sample shrinks sampling error, the gap between a sample statistic and the population value that comes from seeing only a subset."
  chapter: 3
- term: "scale of measurement"
  definition: "A variable's scale of measurement says which comparisons its values support, such as putting them in order, subtracting them, or forming ratios."
  chapter: 1
- term: "scatter plot"
  definition: "A plot that shows each subject as one dot, placed by one measurement on the horizontal x-axis and the other on the vertical y-axis."
  chapter: 2
- term: "Shapiro-Wilk test"
  definition: "A formal test of normality. Its $H_0$ is that the data (or the residuals) came from a normal distribution."
  chapter: 6
- term: "significance level (α)"
  definition: "The probability of rejecting $H_0$ given that $H_0$ is true, chosen before the test. It is the Type I error rate."
  chapter: 4
- term: "sign test"
  definition: "A test that looks only at whether each difference is positive or negative."
  chapter: 7
- term: "simple effect"
  definition: "The effect of one IV at a single level of the other IV, such as the pollution effect under low flow."
  chapter: 10
- term: "simple random sample"
  definition: "A sample chosen so that every member of the population has the same chance of being selected."
  chapter: 3
- term: "Simpson's paradox"
  definition: "A pattern in combined data that reverses once the data are split into meaningful groups."
  chapter: 11
- term: "spurious correlation"
  definition: "A correlation that does not come from a link between the two variables."
  chapter: 2
- term: "standard deviation (SD)"
  definition: "The square root of the variance. It is in the units of the data and gives the typical size of a deviation from the mean."
  chapter: 2
- term: "standard error (SE)"
  definition: "The standard deviation of a sampling distribution."
  chapter: 3
- term: "standardizing"
  definition: "Standardizing converts a raw score, the value as measured, into a $z$-score by subtracting the mean and dividing by the standard deviation."
  chapter: 3
- term: "standard normal"
  definition: "The normal distribution with $\\mu = 0$ and $\\sigma = 1$. A variable with this distribution is written $Z$."
  chapter: 3
- term: "statistical significance"
  definition: "A result is statistically significant when $p < \\alpha$, which means the data would be unlikely if $H_0$ were true."
  chapter: 5
- term: "Student's t distribution"
  definition: "The sampling distribution of $t$ when the population standard deviation is estimated from the sample. Its shape depends on the degrees of freedom."
  chapter: 6
- term: "sum of squares (SS)"
  definition: "The total of the squared deviations from the mean."
  chapter: 2
- term: "symmetric distribution"
  definition: "A distribution whose left and right halves are mirror images around the center."
  chapter: 1
- term: "test statistic"
  definition: "The effect you observed divided by how much it varies by chance."
  chapter: 4
- term: "three-way interaction"
  definition: "A three-way interaction means that the two-way interaction changes across the third factor."
  chapter: 10
- term: "true population distribution"
  definition: "The population the data actually came from. It is never known, and $H_a$ is a claim about it."
  chapter: 4
- term: "Tukey HSD (honestly significant difference)"
  definition: "A post-hoc method that compares every pair of groups while keeping the familywise error rate at $\\alpha$."
  chapter: 8
- term: "two-way interaction"
  definition: "With three IVs, an interaction between two of them."
  chapter: 10
- term: "Type I error"
  definition: "Rejecting $H_0$ when it is actually true, a false positive. Its rate is $\\alpha$."
  chapter: 5
- term: "Type II error"
  definition: "Failing to reject $H_0$ when it is actually false, a missed signal. Its rate is $\\beta$."
  chapter: 5
- term: "unbiased and biased estimators"
  definition: "An estimator is unbiased when its expected value, its average across many samples, equals the population parameter it estimates. It is biased if its expected value systematically differs from that parameter."
  chapter: 3
- term: "variable"
  definition: "What you record for each observation once the measure is applied."
  chapter: 1
- term: "variance"
  definition: "The mean of the squared deviations, which is the sum of squares divided by the number of scores."
  chapter: 2
- term: "variation"
  definition: "How spread out the values in a dataset are."
  chapter: 1
- term: "weighted mean"
  definition: "A mean that multiplies each value by a weight $w_i$, which sets how much that value counts, adds the products, and divides by the sum of the weights."
  chapter: 1
- term: "Welch's t-test"
  definition: "The independent-samples $t$-test without the assumption of equal variances. It uses each group's own variance, and it is R's `t.test()` default."
  chapter: 6
- term: "Wilcoxon signed-rank test"
  definition: "The rank-based alternative to the one-sample or paired $t$-test, which does not assume normality."
  chapter: 7
- term: "within-subjects design"
  see: "repeated-measures design"
  chapter: 8
- term: "z-score"
  definition: "A $z$-score is the number of standard deviations a value is above or below its mean."
  chapter: 3
